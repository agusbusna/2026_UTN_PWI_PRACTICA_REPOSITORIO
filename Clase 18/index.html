<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="contenedor-principal"></div>
    <button id="btn">Click</button>

    <hr/>
    <button id="btn_cont_resta">-</button>
    <span id="contador"></span>
    <button id="btn_cont_suma">+</button>
    
    <hr>

    <button data-number-option ="1" id="btn_1">Opcion 1</button>
    <button data-number-option ="2" id="btn_2">Opcion 2</button>
    <button data-number-option ="3" id="btn_3">Opcion 3</button>

    <div id="option_select">Opcion seleccionada:</div>

    <hr>
    <form action="" id="formulario-login">
        <h1>Iniciar sesion</h1>
        <div>
            <label for="email">Email:</label>
            <br/>
            <input 
                type="email" 
                placeholder="pepe@gmail.com"
                name="email">
        </div>
        <div>
            <label for="password">Password</label>
            <br/>
            <input 
                type="password"
                name="password">
        </div>
        <button type="submit">Enviar</button>
    </form>

    <script src="./scrpit.js"></script>
</body>
</html>
